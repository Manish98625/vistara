<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" fill="none">
  <!-- Define Colors -->
  <defs>
    <style>
      .cls-red { fill: #A50000; }
      .cls-dark { fill: #4B367C; }
      .cls-white { fill: #FFFFFF; }
      .cls-text { font-family: 'Arial Black', sans-serif; font-weight: 900; fill: #A50000; }
    </style>
  </defs>

  <!-- Custom Education Logo -->
  <g transform="translate(50, 80)">
    <!-- Main Logo Circle -->
    <g id="MainLogo">
      <circle class="cls-red" cx="50" cy="50" r="45" opacity="0.9" />
      <circle class="cls-dark" cx="50" cy="50" r="38" opacity="0.7" />
      
      <!-- Inner Elements -->
      <circle class="cls-white" cx="50" cy="50" r="25" opacity="0.3" />
      
      <!-- Graduation Cap -->
      <path class="cls-white" d="M35 45 L65 45 L65 55 L35 55 Z" />
      <path class="cls-white" d="M65 45 L65 50 C65 50 55 52 50 52 L35 52 L35 45" opacity="0.8" />
      <path class="cls-white" d="M30 55 L70 55" stroke="white" stroke-width="2" opacity="0.5" />
      
      <!-- Book/Diploma -->
      <rect class="cls-white" x="40" y="60" width="20" height="15" opacity="0.6" rx="2" />
    </g>

    <!-- Company Name -->
    <g transform="translate(120, 35)">
      <text x="0" y="0" class="cls-text" font-size="58">VISTARA</text>
      <text x="0" y="25" class="cls-text" font-size="16" font-weight="600">EDUCATION CONSULTANCY</text>
      <path d="M0 35 L250 35" stroke="#A50000" stroke-width="2" opacity="0.3" />
      <text x="0" y="55" class="cls-text" font-size="12" font-weight="400" opacity="0.8">PVT. LTD. • GOVERNMENT REGISTERED</text>
      <text x="0" y="70" class="cls-text" font-size="10" font-weight="400" opacity="0.7">SINCE 2014</text>
    </g>
  </g>
</svg>
